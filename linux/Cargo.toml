[package]
name = "keycat"
version = "1.1.0"
edition = "2021"
description = "KeyCat for Linux (Fedora KDE Wayland): a desktop cat living on your screen"
license = "MIT"
publish = false

[dependencies]
gtk = "0.18"
gdk = "0.18"
gio = "0.18"
glib = "0.18"
cairo-rs = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
javascriptcore-rs = "1.1"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
evdev = "0.12"
ksni = "0.2"
png = "0.17"
serde_json = "1"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
