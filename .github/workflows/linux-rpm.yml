name: Linux RPM Release

# Builds the native Fedora KDE Wayland RPM package in a Fedora container.
# - Manual runs (workflow_dispatch) upload the RPM as a workflow artifact.
# - Pushing a `linux-v*` tag automatically creates a GitHub Release with the RPM and SHA256SUMS.
on:
  push:
    tags:
      - 'linux-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Fedora build dependencies
        run: |
          dnf install -y \
            rust \
            cargo \
            gcc \
            pkg-config \
            gtk3-devel \
            webkit2gtk4.1-devel \
            gtk-layer-shell-devel \
            rpm-build \
            findutils

      - name: Build RPM package
        run: |
          chmod +x ./linux/package-rpm.sh
          ./linux/package-rpm.sh
          (cd dist && sha256sum keycat-*.rpm > SHA256SUMS.txt)
          ls -la dist/

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: keycat-fedora-rpm
          path: |
            dist/keycat-*.rpm
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/linux-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/keycat-*.rpm
            dist/SHA256SUMS.txt
